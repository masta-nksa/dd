name: Online stellen
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # Die Kämpfer-Modelle (.glb) liegen nicht im Repository, sondern entstehen hier aus `tools/blender/build_fighter.py`.
  # Schlägt dieser Job fehl, geht der Export trotzdem weiter: das Spiel zeichnet dann die 2D-Figuren.
  models:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Blender holen
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
          curl -fsSL -o blender.tar.xz https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz
          echo "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09  blender.tar.xz" | sha256sum -c -
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
      - name: Acht Kämpfer bauen
        run: ./blender/blender -b -P tools/blender/build_fighter.py -- --fighter all --no-blend --verify
      - uses: actions/upload-artifact@v4
        with:
          name: characters
          path: assets/characters/*.glb
          if-no-files-found: error
  build:
    needs: models
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Modelle holen
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: characters
          path: assets/characters
      - name: Web-Export (Single-Threaded)
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/4.4.1.stable
          mkdir -p build/web
          godot --headless --import
          godot --headless --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
